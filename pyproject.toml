[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
]

[tool.ruff.lint.per-file-ignores]
# sconstruct contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]

[tool.pyright]
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
]

# Tell pyright where to load python code from
extraPaths = [
	"./addon",
]

# General config
analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

# Stricter typing
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# Compliant rules
reportAbstractUsage = true
reportArgumentType = true
reportAssertAlwaysTrue = true
reportAssertTypeFailure = true
reportAssignmentType = true
reportAttributeAccessIssue = true
reportCallInDefaultInitializer = true
reportCallIssue = true
reportConstantRedefinition = true
reportDuplicateImport = true
reportFunctionMemberAccess = true
reportGeneralTypeIssues = true
reportImplicitOverride = true
reportImplicitStringConcatenation = true
reportImportCycles = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportIncompleteStub = true
reportInconsistentConstructor = true
reportInconsistentOverload = true
reportIndexIssue = true
reportInvalidStringEscapeSequence = true
reportInvalidStubStatement = true
reportInvalidTypeArguments = true
reportInvalidTypeForm = true
reportInvalidTypeVarUse = true
reportMatchNotExhaustive = true
reportMissingImports = true
reportMissingModuleSource = true
reportMissingParameterType = true
reportMissingSuperCall = true
reportMissingTypeArgument = true
reportNoOverloadImplementation = true
reportOperatorIssue = true
reportOptionalCall = true
reportOptionalContextManager = true
reportOptionalIterable = true
reportOptionalMemberAccess = true
reportOptionalOperand = true
reportOptionalSubscript = true
reportOverlappingOverload = true
reportPossiblyUnboundVariable = true
reportPrivateImportUsage = true
reportPrivateUsage = true
reportPropertyTypeMismatch = true
reportRedeclaration = true
reportReturnType = true
reportSelfClsParameterName = true
reportShadowedImports = true
reportTypeCommentUsage = true
reportTypedDictNotRequiredAccess = true
reportUnboundVariable = true
reportUndefinedVariable = true
reportUnhashable = true
reportUninitializedInstanceVariable = true
reportUnknownArgumentType = true
reportUnknownLambdaType = true
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnnecessaryIsInstance = true
reportUnnecessaryTypeIgnoreComment = true
reportUnsupportedDunderAll = true
reportUntypedBaseClass = true
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUntypedNamedTuple = true
reportUnusedCallResult = true
reportUnusedClass = true
reportUnusedCoroutine = true
reportUnusedExcept = true
reportUnusedExpression = true
reportUnusedFunction = true
reportUnusedImport = true
reportUnusedVariable = true
reportWildcardImportFromLibrary = true

reportDeprecated = true

# Can be enabled by generating type stubs for modules via pyright CLI
reportMissingTypeStubs = false

# Bad rules
# These are sorted alphabetically and should be enabled and moved to compliant rules section when resolved.

[tool.pylint.main]
py-version = "3.13"
recursive = true

[tool.pylint.messages_control]
disable = [
	# Ruff already handles these areas.
	"line-too-long",
	"trailing-whitespace",
	"missing-final-newline",

	# Too noisy for this project initially.
	"missing-module-docstring",
	"missing-class-docstring",
	"missing-function-docstring",

	# Naming/style overlap with Ruff.
	"invalid-name",

	# Pylint's generic warnings about too-few-public-methods
	# are often inappropriate for small utility/data classes.
	"too-few-public-methods",

	# Lazy imports inside functions are a deliberate NVDA add-on pattern
	# to keep startup imports cheap; Pyright still type-checks them.
	"import-outside-toplevel",

	# Protocol method stubs use ``...`` as their body (PEP 544);
	# Pylint treats the ellipsis as redundant next to the docstring.
	"unnecessary-ellipsis",
]

[tool.pylint.format]
max-line-length = 110

# The project uses tabs for indentation (see [tool.ruff.format] indent-style).
indent-string = "\t"

[tool.pylint.design]
# Thresholds are tuned to this codebase's actual design norms:
# NVDA settings panels accumulate controls as instance attributes, UI
# plumbing methods legitimately carry many parameters, and stream/retry
# loops need more locals/branches than a generic limit would allow.
# Genuinely extreme methods are suppressed in-file with a justification.
max-args = 10
max-attributes = 20
max-bool-expr = 5
max-branches = 25
max-locals = 25
max-parents = 7
max-positional-arguments = 10
max-public-methods = 25
max-returns = 10
max-statements = 80

[tool.pylint.variables]
additional-builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

[tool.pylint.imports]
known-standard-library = []

[tool.pylint.typecheck]
# NVDA-internal modules and third-party runtime dependencies are only
# importable inside NVDA's embedded Python, not the dev interpreter.
# Pyright (extraPaths + strict) is the source of truth for types here.
ignored-modules = [
	"addonHandler",
	"api",
	"controlTypes",
	"globalPluginHandler",
	"gui",
	"gui.settingsDialogs",
	"languageHandler",
	"latex2mathml.converter",
	"locationHelper",
	"logHandler",
	"queueHandler",
	"scriptHandler",
	"textInfos",
	"tones",
	"treeInterceptorHandler",
	"ui",
	"winUser",
	"wx",
]

# Pylint cannot infer the dynamically generated PIL constants
# (e.g. Image.LANCZOS is an enum alias set at import time) and cannot
# introspect pywin32 C-extension members (win32pipe/win32file) from source.
extension-pkg-allow-list = [
	"PIL",
	"win32file",
	"win32pipe",
]
generated-members = ["LANCZOS"]
