[project]
name = "nvda-ai-assistant-dev"
version = "0.0.0"
description = "Development and test environment for the NVDA AI Assistant add-on"
requires-python = ">=3.13,<3.14"
dependencies = [
	"comtypes==1.4.13",
	"configobj @ git+https://github.com/DiffSK/configobj@9c8a0a80c767bf8a3d6493ed01df6c351bddca42",
	"jinja2==3.1.6",
	"latex2mathml==3.78.1",
	"markdown==3.10",
	"pillow==12.1.1",
	"pyserial==3.5",
	"pywin32==311",
	"pyyaml==6.0.3",
	"wxpython==4.2.4",
]

[dependency-groups]
dev = [
	"pytest==9.0.2",
	"ruff==0.15.9",
	"scons==4.10.1",
]

[tool.uv]
package = false
default-groups = ["dev"]
environments = ["sys_platform == 'win32'"]
required-version = ">=0.9"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-m", "not nvda_integration"]
testpaths = [
	"tests",
]
python_files = ["test_*.py"]
markers = [
	"nvda_integration: requires a built sibling NVDA checkout and its native helper DLLs",
]
norecursedirs = [
	".git",
	".venv",
	"addon/globalPlugins/AI-assistant/lib",
	"dist",
	"embedding_engine",
	"memory_engine",
	"runtime_supervisor",
]

[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	".agents",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
extend-select = [
	"TID251",  # flake8-tidy-imports: banned-api
]
ignore = [
	# indentation contains tabs
	"W191",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logHandler".msg = "Use standard library 'logging.getLogger(__name__)' instead of NVDA logHandler."
"languageHandler".msg = "Access language via injected LanguageResolver port."
"api".msg = "NVDA api access is forbidden outside Layer 0 adapter surfaces."
"textInfos".msg = "textInfos is forbidden outside Layer 0 adapter surfaces."
"controlTypes".msg = "controlTypes is forbidden outside Layer 0 adapter surfaces."
"globalPluginHandler".msg = "globalPluginHandler is forbidden outside plugin/controller.py."
"scriptHandler".msg = "scriptHandler is forbidden outside plugin/controller.py."
"queueHandler".msg = "queueHandler is forbidden outside ui/nvda_ui.py and ui/host_renderer.py."
"gui".msg = "gui is forbidden outside ui/ dialogs."
"wx".msg = "wx is forbidden outside ui/ dialogs."
"speech".msg = "speech is forbidden outside ui/nvda_ui.py."
"tones".msg = "tones is forbidden outside ui/nvda_ui.py."
"addonHandler".msg = "addonHandler is forbidden outside Layer 0 plugin/controller.py and ui/ panels."
"globalVars".msg = "globalVars is forbidden outside Layer 0 adapter surfaces."
"winUser".msg = "winUser is forbidden outside Layer 0 adapter surfaces."
"locationHelper".msg = "locationHelper is forbidden outside Layer 0 adapter surfaces."
"treeInterceptorHandler".msg = "treeInterceptorHandler is forbidden outside Layer 0 extractors."
"nvwave".msg = "nvwave is forbidden outside Layer 0 audio adapter surfaces."

[tool.ruff.lint.per-file-ignores]
# sconstruct contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]

# NVDA entry points must run bootstrap code (sys.path setup, translation
# init) before importing plugin modules, so imports can't be at the top.
"addon/globalPlugins/AI-assistant/__init__.py" = ["E402"]
"addon/globalPlugins/AI-assistant/plugin/__init__.py" = ["E402"]

# Layer 0 adapter surfaces legitimately importing NVDA / wx / host APIs
"addon/globalPlugins/AI-assistant/ui/**" = ["TID251"]
"addon/globalPlugins/AI-assistant/image/**" = ["TID251"]
"addon/globalPlugins/AI-assistant/context/extractors/**" = ["TID251"]
"addon/globalPlugins/AI-assistant/context/navigation.py" = ["TID251"]
"addon/globalPlugins/AI-assistant/plugin/**" = ["TID251"]
"addon/globalPlugins/AI-assistant/utils/clipboard.py" = ["TID251"]
"addon/globalPlugins/AI-assistant/utils/logger.py" = ["TID251"]
"tests/**" = ["TID251"]
"conftest.py" = ["TID251"]

[tool.pyright]
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
]

# Tell pyright where to load python code from
extraPaths = [
	"./addon",
]

# General config
analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

# Stricter typing
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# Compliant rules
reportAbstractUsage = true
reportArgumentType = true
reportAssertAlwaysTrue = true
reportAssertTypeFailure = true
reportAssignmentType = true
reportAttributeAccessIssue = true
reportCallInDefaultInitializer = true
reportCallIssue = true
reportConstantRedefinition = true
reportDuplicateImport = true
reportFunctionMemberAccess = true
reportGeneralTypeIssues = true
reportImplicitOverride = true
reportImplicitStringConcatenation = true
reportImportCycles = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportIncompleteStub = true
reportInconsistentConstructor = true
reportInconsistentOverload = true
reportIndexIssue = true
reportInvalidStringEscapeSequence = true
reportInvalidStubStatement = true
reportInvalidTypeArguments = true
reportInvalidTypeForm = true
reportInvalidTypeVarUse = true
reportMatchNotExhaustive = true
reportMissingImports = true
reportMissingModuleSource = true
reportMissingParameterType = true
reportMissingSuperCall = true
reportMissingTypeArgument = true
reportNoOverloadImplementation = true
reportOperatorIssue = true
reportOptionalCall = true
reportOptionalContextManager = true
reportOptionalIterable = true
reportOptionalMemberAccess = true
reportOptionalOperand = true
reportOptionalSubscript = true
reportOverlappingOverload = true
reportPossiblyUnboundVariable = true
reportPrivateImportUsage = true
reportPrivateUsage = true
reportPropertyTypeMismatch = true
reportRedeclaration = true
reportReturnType = true
reportSelfClsParameterName = true
reportShadowedImports = true
reportTypeCommentUsage = true
reportTypedDictNotRequiredAccess = true
reportUnboundVariable = true
reportUndefinedVariable = true
reportUnhashable = true
reportUninitializedInstanceVariable = true
reportUnknownArgumentType = true
reportUnknownLambdaType = true
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnnecessaryIsInstance = true
reportUnnecessaryTypeIgnoreComment = true
reportUnsupportedDunderAll = true
reportUntypedBaseClass = true
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUntypedNamedTuple = true
reportUnusedCallResult = true
reportUnusedClass = true
reportUnusedCoroutine = true
reportUnusedExcept = true
reportUnusedExpression = true
reportUnusedFunction = true
reportUnusedImport = true
reportUnusedVariable = true
reportWildcardImportFromLibrary = true

reportDeprecated = true

# Can be enabled by generating type stubs for modules via pyright CLI
reportMissingTypeStubs = false

# Bad rules
# These are sorted alphabetically and should be enabled and moved to compliant rules section when resolved.

[tool.pylint.main]
py-version = "3.13"
recursive = true

[tool.pylint.messages_control]
disable = [
	# Ruff already handles these areas.
	"line-too-long",
	"trailing-whitespace",
	"missing-final-newline",

	# Too noisy for this project initially.
	"missing-module-docstring",
	"missing-class-docstring",
	"missing-function-docstring",

	# Naming/style overlap with Ruff.
	"invalid-name",

	# Pylint's generic warnings about too-few-public-methods
	# are often inappropriate for small utility/data classes.
	"too-few-public-methods",

	# Lazy imports inside functions are a deliberate NVDA add-on pattern
	# to keep startup imports cheap; Pyright still type-checks them.
	"import-outside-toplevel",

	# NVDA package entry points (addon root and plugin package __init__)
	# must run bootstrap code (sys.path setup, addonHandler.initTranslation)
	# before importing plugin modules; import ordering is intentional there.
	"wrong-import-position",

	# Protocol method stubs use ``...`` as their body (PEP 544);
	# Pylint treats the ellipsis as redundant next to the docstring.
	"unnecessary-ellipsis",
]

[tool.pylint.format]
max-line-length = 110

# The project uses tabs for indentation (see [tool.ruff.format] indent-style).
indent-string = "\t"

[tool.pylint.design]
# Thresholds are tuned to this codebase's actual design norms:
# NVDA settings panels accumulate controls as instance attributes, UI
# plumbing methods legitimately carry many parameters, and stream/retry
# loops need more locals/branches than a generic limit would allow.
# Genuinely extreme methods are suppressed in-file with a justification.
max-args = 10
max-attributes = 20
max-bool-expr = 5
max-branches = 25
max-locals = 25
max-parents = 7
max-positional-arguments = 10
max-public-methods = 25
max-returns = 10
max-statements = 80

[tool.pylint.variables]
additional-builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

[tool.pylint.imports]
known-standard-library = []

[tool.pylint.typecheck]
# NVDA-internal modules and third-party runtime dependencies are only
# importable inside NVDA's embedded Python, not the dev interpreter.
# Pyright (extraPaths + strict) is the source of truth for types here.
ignored-modules = [
	"addonHandler",
	"api",
	"controlTypes",
	"globalPluginHandler",
	"gui",
	"gui.settingsDialogs",
	"languageHandler",
	"latex2mathml.converter",
	"locationHelper",
	"logHandler",
	"queueHandler",
	"screenCurtain",
	"scriptHandler",
	"textInfos",
	"tones",
	"treeInterceptorHandler",
	"ui",
	"winUser",
	"wx",
	# Test-only support module: tests insert the ui directory on sys.path
	# at runtime, so it is not importable from the repo root for Pylint.
	"test_bootstrap",
]

# Pylint cannot infer the dynamically generated PIL constants
# (e.g. Image.LANCZOS is an enum alias set at import time) and cannot
# introspect pywin32 C-extension members (win32pipe/win32file/pywintypes)
# or the compiled Rust/PyO3 llm_client module from source.
extension-pkg-allow-list = [
	"PIL",
	"pywintypes",
	"win32file",
	"win32pipe",
]
# pywintypes.error is defined inside the C extension at import time, so it
# is missed even with the allow-list; generated-members suppresses it.
generated-members = ["LANCZOS", "OpenAiClient", "RuntimeStatus", "RuntimeSupervisor", "pywintypes.error"]
