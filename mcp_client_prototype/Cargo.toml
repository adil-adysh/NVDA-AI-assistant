[package]
name = "mcp-client-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[features]
fixture-server = ["rmcp/server", "rmcp/macros", "rmcp/transport-io"]

[dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
url = "2"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }

[dev-dependencies]
axum = "0.8"
env_logger = "0.11"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "time", "signal", "net"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "mock_mcp"
path = "src/bin/mock_mcp.rs"
required-features = ["fixture-server"]

[[bin]]
name = "mcp_manager"
path = "src/main.rs"
