name: Python quality

on:
  push:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - "nvda-source.toml"
      - ".github/workflows/python-quality.yml"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - "nvda-source.toml"
      - ".github/workflows/python-quality.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NVDA-AI-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          path: NVDA-AI-assistant
      - uses: actions/checkout@v4
        with:
          repository: nvaccess/nvda
          ref: 797a881381f8bedabc13456d3aa76bdd77d71503
          path: nvda
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - uses: moonrepo/setup-rust@v1
        with:
          channel: "1.97.1"
          profile: minimal
      - name: Build runtime supervisor test extension
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        run: |
          $env:PYO3_PYTHON = (Resolve-Path .venv/Scripts/python.exe).Path
          cargo build --manifest-path runtime_supervisor/Cargo.toml --release --locked
          if ($LASTEXITCODE -ne 0) { throw "Runtime supervisor build failed" }
          $extension = Get-ChildItem runtime_supervisor/target -Recurse -Filter runtime_supervisor.dll |
            Where-Object { $_.FullName -match '[\\/]release[\\/]' -and $_.FullName -notmatch '[\\/]deps[\\/]' } |
            Select-Object -First 1
          if (-not $extension) { throw "Built runtime_supervisor.dll was not found" }
          $addonLib = "addon/globalPlugins/AI-assistant/lib"
          New-Item -ItemType Directory -Path $addonLib -Force | Out-Null
          Copy-Item $extension.FullName "$addonLib/runtime_supervisor.pyd"
      - run: uv run pytest
      - run: uv run scons --dry-run

  built-nvda-integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NVDA-AI-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          path: NVDA-AI-assistant
      - uses: actions/checkout@v4
        with:
          repository: nvaccess/nvda
          ref: 797a881381f8bedabc13456d3aa76bdd77d71503
          path: nvda
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Build NVDA native artifacts
        working-directory: nvda
        run: |
          uv sync
          uv run scons
      - run: uv sync --locked
      - run: uv run pytest -m nvda_integration
