name: build-and-release-addon

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: nvda_ui_host/package-lock.json

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          profile: minimal

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install pre-commit scons markdown

      - name: Install gettext tools
        run: choco install gettext -y

      - name: Run code checks
        env:
          SKIP: no-commit-to-branch
        run: |
          pre-commit run --all-files

      - name: Build host
        run: python scripts/build_host.py

      - name: Build addon
        run: |
          scons
          scons pot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged_addon
          path: |
            ./*.nvda-addon
            ./*.pot

  release:
    runs-on: windows-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Move artifacts to root
        run: |
          Copy-Item -Path packaged_addon\* -Destination . -Recurse

      - name: Extract version
        id: version
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: nvda_ui_host/package-lock.json

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          profile: minimal

      - name: Install git-cliff binary
        run: |
          cargo install git-cliff --locked

      - name: Generate release notes
        run: |
          git-cliff --config cliff.toml --current --output RELEASE_NOTES.md
          Add-Content RELEASE_NOTES.md ""
          Add-Content RELEASE_NOTES.md "### SHA256"
          Get-FileHash -Algorithm SHA256 *.nvda-addon | ForEach-Object {
            Add-Content RELEASE_NOTES.md "$($_.Hash)  $(Split-Path $_.Path -Leaf)"
          }

      - name: Debug release notes
        run: Get-Content RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.nvda-addon
            *.pot
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
