name: build-and-release-addon

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "npm"
          cache-dependency-path: nvda_ui_host/package-lock.json

      - name: Setup Rust
        uses: moonrepo/setup-rust@v1
        with:
          inherit-toolchain: true
          profile: minimal

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install pre-commit scons markdown

      - name: Install gettext tools
        run: |
          choco install gettext -y
          $gettextBin = 'C:\Program Files\gettext-iconv\bin'
          "${gettextBin}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run code checks
        env:
          SKIP: no-commit-to-branch
        run: |
          pre-commit run --all-files

      - name: Build addon
        run: |
          scons
          scons pot

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packaged_addon
          path: |
            ./*.nvda-addon
            ./*.pot

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Move artifacts to root
        run: |
          cp -r packaged_addon/* .

      - name: Extract version
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff binary
        run: |
          DOWNLOAD_URL=$(python3 -c "import json, sys, urllib.request; req = urllib.request.Request('https://api.github.com/repos/orhun/git-cliff/releases/latest', headers={'User-Agent': 'github-actions'}); release = json.loads(urllib.request.urlopen(req).read()); assets = [asset['browser_download_url'] for asset in release['assets'] if 'x86_64-unknown-linux-gnu.tar.gz' in asset['browser_download_url']]; print(assets[0] if assets else sys.exit('No x86_64 linux asset found'))")
          echo "Installing git-cliff from ${DOWNLOAD_URL}"
          curl -sSL "$DOWNLOAD_URL" | tar xz -C /tmp
          sudo mv /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
          sudo chmod +x /usr/local/bin/git-cliff

      - name: Generate release notes
        run: |
          git-cliff --config cliff.toml --current --output RELEASE_NOTES.md
          printf '\n### SHA256\n' >> RELEASE_NOTES.md
          sha256sum *.nvda-addon >> RELEASE_NOTES.md

      - name: Debug release notes
        run: cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.nvda-addon
            *.pot
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
