name: build-and-release-addon

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create requirements
        run: echo -e "pre-commit\nscons\nmarkdown" > requirements.txt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          sudo apt-get update -y
          sudo apt-get install -y gettext

      - name: Run code checks
        run: |
          export SKIP=no-commit-to-branch
          pre-commit run --all-files

      - name: Build addon
        run: |
          scons
          scons pot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged_addon
          path: |
            ./*.nvda-addon
            ./*.pot

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Move artifacts to root
        run: |
          cp -r packaged_addon/* .

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install git-cliff binary
        run: |
          set -euo pipefail
          DOWNLOAD_URL=$(python3 -c "import json, urllib.request, sys; req=urllib.request.Request('https://api.github.com/repos/orhun/git-cliff/releases/latest', headers={'User-Agent':'github-actions'}); obj=json.loads(urllib.request.urlopen(req).read()); assets=[a['browser_download_url'] for a in obj['assets'] if 'x86_64-unknown-linux-gnu.tar.gz' in a['browser_download_url']]; print(assets[0] if assets else sys.exit('No x86_64 linux asset found'))")
          echo "Installing git-cliff from ${DOWNLOAD_URL}"
          curl -sSL "$DOWNLOAD_URL" | tar xz -C /tmp
          sudo mv /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
          sudo chmod +x /usr/local/bin/git-cliff

      - name: Generate release notes
        run: |
          git-cliff --config cliff.toml --current --output RELEASE_NOTES.md
          echo -e "\n### SHA256" >> RELEASE_NOTES.md
          sha256sum *.nvda-addon >> RELEASE_NOTES.md

      - name: Debug release notes
        run: cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.nvda-addon
            *.pot
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
