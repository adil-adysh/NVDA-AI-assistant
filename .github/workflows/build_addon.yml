name: build-and-release-addon

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create requirements
        run: echo -e "pre-commit\nscons\nmarkdown" > requirements.txt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          sudo apt-get update -y
          sudo apt-get install -y gettext

      - name: Run code checks
        run: |
          export SKIP=no-commit-to-branch
          pre-commit run --all-files

      - name: Build addon
        run: |
          scons
          scons pot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged_addon
          path: |
            ./*.nvda-addon
            ./*.pot

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Move artifacts to root
        run: |
          cp -r packaged_addon/* .

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate version exists in changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_FILE="changelog.md"
          test -f "$CHANGELOG_FILE" || (echo "Missing $CHANGELOG_FILE" && exit 1)
          ESCAPED_VERSION=$(printf '%s' "$VERSION" | sed -e 's/[][.^$*\/]/\\&/g')
          grep -E "^## ${ESCAPED_VERSION}([[:space:]]|$)" "$CHANGELOG_FILE" > /dev/null || (echo "Version not found in $CHANGELOG_FILE" && exit 1)

      - name: Check duplicate versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_FILE="changelog.md"
          ESCAPED_VERSION=$(printf '%s' "$VERSION" | sed -e 's/[][.^$*\/]/\\&/g')
          COUNT=$(grep -E -c "^## ${ESCAPED_VERSION}([[:space:]]|$)" "$CHANGELOG_FILE")
          if [ "$COUNT" -ne 1 ]; then
            echo "Duplicate or missing version entries in $CHANGELOG_FILE"
            exit 1
          fi

      - name: Extract changelog for version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_FILE="changelog.md"
          awk -v ver="## ${VERSION}" '
          index($0, ver) == 1 {flag=1; print; next}
          /^## / && flag {exit}
          flag
          ' "$CHANGELOG_FILE" > RELEASE_NOTES.md

      - name: Add SHA256 checksum
        run: |
          echo -e "\n### SHA256" >> RELEASE_NOTES.md
          sha256sum *.nvda-addon >> RELEASE_NOTES.md

      - name: Debug release notes
        run: cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.nvda-addon
            *.pot
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
