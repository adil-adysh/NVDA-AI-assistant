[package]
name = "embedding_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "embedding_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23"
hf-hub = { version = "1.0", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
dirs = "6"
